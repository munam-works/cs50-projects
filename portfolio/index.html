<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bruce Wayne | Portfolio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
 
      body {
        font-family: Georgia, serif;
        background-color: #ffffff;
        color: #222222;
        line-height: 1.7;
      }
 
      /* ── HEADER ── */
      header {
        padding: 24px 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #e0e0e0;
      }
 
      header h1 {
        font-size: 1.2rem;
        font-weight: normal;
        letter-spacing: 1px;
        color: #222;
      }
 
      nav {
        display: flex;
        gap: 32px;
      }
 
      nav a {
        text-decoration: none;
        color: #555;
        font-family: Arial, sans-serif;
        font-size: 0.9rem;
      }
 
      nav a:hover {
        color: #000;
      }
 
      /* ── HERO ── */
      .hero {
        padding: 90px 60px;
        max-width: 700px;
      }
 
      .hero p.hello {
        font-family: Arial, sans-serif;
        font-size: 0.9rem;
        color: #888;
        margin-bottom: 12px;
        letter-spacing: 1px;
      }
 
      .hero h2 {
        font-size: 3rem;
        font-weight: normal;
        color: #111;
        margin-bottom: 20px;
        line-height: 1.2;
      }
 
      .hero p.bio {
        font-family: Arial, sans-serif;
        font-size: 1rem;
        color: #555;
        margin-bottom: 36px;
        max-width: 500px;
      }
 
      .btn {
        display: inline-block;
        padding: 12px 28px;
        border: 1px solid #222;
        text-decoration: none;
        color: #222;
        font-family: Arial, sans-serif;
        font-size: 0.85rem;
        letter-spacing: 1px;
      }
 
      .btn:hover {
        background-color: #222;
        color: #fff;
      }
 
      /* ── DIVIDER ── */
     `  
  </body>
</html>
